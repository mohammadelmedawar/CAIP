<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R and R² playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --panel:#FFFFFF; --ink:#17222E; --muted:#5B6878; --grid:#DFE5EC; --axis:#9AA6B4;
  --point:#2F6FB0; --line:#B5306B; --resid:#C98A12; --bad:#6E45B8; --unexplained:#D3DAE3;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161E; --panel:#18212C; --ink:#E5EBF1; --muted:#97A4B3; --grid:#25303C; --axis:#4E5C6C;
    --point:#6FA8E6; --line:#F06A9E; --resid:#E5AE45; --bad:#AE8BF0; --unexplained:#2E3A48;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161E; --panel:#18212C; --ink:#E5EBF1; --muted:#97A4B3; --grid:#25303C; --axis:#4E5C6C;
  --point:#6FA8E6; --line:#F06A9E; --resid:#E5AE45; --bad:#AE8BF0; --unexplained:#2E3A48;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4;}

/* ---------- layout: desktop / landscape ---------- */
.app{height:100%;max-width:1600px;margin:0 auto;padding:12px 16px;display:grid;gap:12px;
  grid-template-columns:minmax(0,1fr) clamp(300px,29vw,390px);
  grid-template-rows:auto auto auto minmax(0,1fr);
  grid-template-areas:"head head" "plot read" "plot ctrl" "plot curve";}
header{grid-area:head;display:flex;align-items:baseline;gap:6px 18px;flex-wrap:wrap;}
header h1{font-size:clamp(1.2rem,1rem + 1.2vw,1.9rem);font-weight:800;letter-spacing:-0.02em;margin:0;}
header p{margin:0;color:var(--muted);font-size:.92rem;}
.panel{background:var(--panel);border-radius:12px;padding:12px 14px;min-height:0;min-width:0;}
.plot{grid-area:plot;display:flex;flex-direction:column;}
.read{grid-area:read;}
.ctrl{grid-area:ctrl;}
.curve{grid-area:curve;display:flex;flex-direction:column;min-height:120px;}
.canvas-box{position:relative;flex:1 1 auto;min-height:0;touch-action:none;}
.canvas-box canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}

/* ---------- small pieces ---------- */
.titlebar{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin-bottom:6px;}
h2{font-size:.95rem;font-weight:700;margin:0;}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px;}
.legend .dot{width:8px;height:8px;border-radius:50%;}
.note{font-size:.8rem;color:var(--muted);}

.readouts{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.big{padding:6px 10px;border-radius:9px;border:1px solid var(--grid);}
.big .name{font-size:.8rem;color:var(--muted);font-weight:600;}
.big .val{font-size:clamp(1.4rem,0.6rem + 3.2vh,2.3rem);font-weight:800;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;line-height:1.1;}
.big.r .val{color:var(--point);}
.big.r2 .val{color:var(--line);}
.big.r2.biased .val{color:var(--bad);}
.eq{margin:8px 0 0;font-variant-numeric:tabular-nums;font-weight:700;font-size:.95rem;}
.verdict{margin:2px 0 0;color:var(--muted);font-size:.85rem;}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--unexplained);margin-top:8px;}
.bar span{display:block;background:var(--point);transition:width .15s ease;}
.barlabel{display:flex;justify-content:space-between;gap:8px;white-space:nowrap;font-size:.78rem;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums;}

.sliders{display:grid;grid-template-columns:1fr;gap:6px;}
label.ctl{display:block;font-weight:600;font-size:.88rem;}
label.ctl output{float:right;font-variant-numeric:tabular-nums;color:var(--muted);}
input[type=range]{width:100%;margin:4px 0 0;accent-color:var(--point);}
.presets{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center;}
button{font:inherit;font-size:.82rem;font-weight:600;color:var(--ink);background:transparent;border:1px solid var(--axis);border-radius:7px;padding:4px 9px;cursor:pointer;}
button:hover{border-color:var(--ink);}
button.primary{background:var(--ink);color:var(--panel);border-color:var(--ink);margin-left:auto;}
button:focus-visible,input:focus-visible{outline:3px solid var(--point);outline-offset:2px;}
.toggles{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:8px;font-size:.86rem;}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer;}
.toggles input{accent-color:var(--point);margin:0;}
.edited{display:none;font-size:.78rem;color:var(--resid);font-weight:600;margin-top:4px;}
.edited.on{display:block;}

/* ---------- short desktop screens ---------- */
@media (max-height:760px) and (min-width:821px){
  .app{padding:8px 12px;gap:8px;}
  header p,.verdict{display:none;}
  .panel{padding:8px 12px;}
}

/* ---------- portrait / phones ---------- */
@media (max-width:820px){
  body{font-size:14px;}
  .app{padding:8px 10px;gap:8px;
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:auto auto minmax(0,1.6fr) minmax(0,1fr) auto;
    grid-template-areas:"head" "read" "plot" "curve" "ctrl";}
  header p{display:none;}
  .panel{padding:8px 10px;}
  .curve{min-height:90px;}
  .read{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:4px 8px;align-items:center;}
  .readouts{display:contents;}
  .big{padding:3px 8px;}
  .big .val{font-size:1.5rem;}
  .read .meta{min-width:0;}
  .eq{margin:0;font-size:.85rem;}
  .verdict{display:none;}
  .bar{margin-top:4px;}
  .barlabel{font-size:.72rem;}
  .sliders{grid-template-columns:1fr 1fr;gap:4px 12px;}
  .legend{display:none;}
  .note{display:none;}
}
@media (max-width:820px) and (max-height:640px){
  .curve{display:none;}
  .app{grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"head" "read" "plot" "ctrl";}
}
/* fallback for tiny screens: allow scrolling rather than crushing */
@media (max-height:420px),(max-width:300px){body{overflow:auto;}.app{height:auto;min-height:100%;}.plot{height:70vh;}}
@media (prefers-reduced-motion:reduce){.bar span{transition:none;}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>R and R², side by side</h1>
    <p>Move the slider, drag a point, or tap empty space to add one.</p>
  </header>

  <section class="panel plot">
    <div class="titlebar">
      <h2>Ads spent vs sales</h2>
      <div class="legend">
        <span><i class="dot" style="background:var(--point)"></i>Data</span>
        <span><i style="background:var(--line)"></i>Best fit</span>
        <span><i style="background:var(--resid)"></i>Residuals</span>
      </div>
    </div>
    <div class="canvas-box" id="scatterBox">
      <canvas id="scatter" aria-label="Scatter plot of ad spend against sales with the regression line"></canvas>
    </div>
  </section>

  <section class="panel read">
    <div class="readouts">
      <div class="big r"><div class="name">R</div><div class="val" id="rVal">0.00</div></div>
      <div class="big r2" id="r2Card"><div class="name" id="r2Name">R²</div><div class="val" id="r2Val">0.00</div></div>
    </div>
    <div class="meta">
      <p class="eq" id="eq">y = ax + b</p>
      <p class="verdict" id="verdict"></p>
      <div class="bar"><span id="barFill" style="width:0%"></span></div>
      <div class="barlabel"><span id="barExp">Explained 0%</span><span id="barUnexp">Unexplained 100%</span></div>
    </div>
  </section>

  <section class="panel ctrl">
    <div class="sliders">
      <label class="ctl">Target R <output id="rOut">0.70</output>
        <input type="range" id="rSlider" min="-1" max="1" step="0.01" value="0.7"></label>
      <label class="ctl">Points <output id="nOut">60</output>
        <input type="range" id="nSlider" min="5" max="300" step="1" value="60"></label>
    </div>
    <div class="presets" id="presets">
      <button data-r="1">1</button><button data-r="0.9">0.9</button><button data-r="0.5">0.5</button>
      <button data-r="0">0</button><button data-r="-0.5">−0.5</button><button data-r="-1">−1</button>
      <button class="primary" id="newBtn">New sample</button>
    </div>
    <div class="toggles">
      <label><input type="checkbox" id="residChk" checked> Residuals</label>
      <label title="Predictions use twice the slope. R stays the same, but R² falls and can go negative."><input type="checkbox" id="badChk"> Biased model</label>
    </div>
    <div class="edited" id="edited">Points edited by hand, so R no longer matches the slider.</div>
  </section>

  <section class="panel curve">
    <div class="titlebar">
      <h2>R → R² curve</h2>
      <span class="note">R² = R × R, so the sign doesn’t matter</span>
    </div>
    <div class="canvas-box" id="curveBox"><canvas id="curve" aria-label="Curve showing R squared as a function of R"></canvas></div>
  </section>
</div>

<script>
(function(){
  const XMIN=0,XMAX=100,YMIN=0,YMAX=400;
  const S={pts:[],r:0.7,n:60,resid:true,biased:false,edited:false};
  const $=id=>document.getElementById(id);
  const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const FONT='"Public Sans",system-ui,sans-serif';

  function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
  function standardize(a){const n=a.length,m=a.reduce((s,v)=>s+v,0)/n;let ss=0;for(const v of a)ss+=(v-m)*(v-m);const sd=Math.sqrt(ss/n)||1;return a.map(v=>(v-m)/sd);}

  function generate(){
    const n=S.n;let x=[],z=[];
    for(let i=0;i<n;i++){x.push(randn());z.push(randn());}
    x=standardize(x);z=standardize(z);
    let dot=0,xx=0;for(let i=0;i<n;i++){dot+=z[i]*x[i];xx+=x[i]*x[i];}
    z=z.map((v,i)=>v-dot/xx*x[i]);z=standardize(z);
    const r=S.r,k=Math.sqrt(Math.max(0,1-r*r));
    S.pts=x.map((xi,i)=>({x:50+14*xi,y:200+55*(r*xi+k*z[i])}));
    S.edited=false;update();
  }

  function stats(){
    const p=S.pts,n=p.length;if(n<2)return null;
    let mx=0,my=0;for(const q of p){mx+=q.x;my+=q.y;}mx/=n;my/=n;
    let sxx=0,syy=0,sxy=0;for(const q of p){const dx=q.x-mx,dy=q.y-my;sxx+=dx*dx;syy+=dy*dy;sxy+=dx*dy;}
    const a=sxx?sxy/sxx:0,b=my-a*mx;
    const R=(sxx&&syy)?sxy/Math.sqrt(sxx*syy):0;
    const ma=S.biased?2*a:a,mb=my-ma*mx;
    let sse=0;for(const q of p){const e=q.y-(ma*q.x+mb);sse+=e*e;}
    return {a,b,R,R2:R*R,ma,mb,R2model:syy?1-sse/syy:0};
  }
  function fmt(v,d=2){const s=Math.abs(v).toFixed(d);return (v<0&&+s!==0?'−':'')+s;}
  function strength(R){const a=Math.abs(R);
    if(a<0.1)return 'Almost no linear relationship.';
    const w=a>=0.999?'Perfect':a>=0.7?'Strong':a>=0.5?'Moderate':a>=0.3?'Weak':'Very weak';
    return w+(R>0?' positive: more ad spend, more sales.':' negative: more ad spend, fewer sales.');}

  function fit(canvas,box){
    const dpr=window.devicePixelRatio||1,w=box.clientWidth,h=box.clientHeight;
    const W=Math.max(1,Math.round(w*dpr)),H=Math.max(1,Math.round(h*dpr));
    if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H;}
    const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return {ctx,w,h};
  }

  /* scatter */
  const sc=$('scatter'),scBox=$('scatterBox');
  const M={l:50,r:10,t:8,b:38};let geom={w:0,h:0};
  const X=x=>M.l+(x-XMIN)/(XMAX-XMIN)*(geom.w-M.l-M.r);
  const Y=y=>geom.h-M.b-(y-YMIN)/(YMAX-YMIN)*(geom.h-M.t-M.b);
  const iX=px=>XMIN+(px-M.l)/(geom.w-M.l-M.r)*(XMAX-XMIN);
  const iY=py=>YMIN+(geom.h-M.b-py)/(geom.h-M.t-M.b)*(YMAX-YMIN);
  let drag=null;

  function drawScatter(st){
    const {ctx,w,h}=fit(sc,scBox);geom={w,h};if(w<40||h<40)return;
    const small=w<420||h<260;M.l=small?40:50;M.b=small?32:38;
    ctx.clearRect(0,0,w,h);ctx.font=(small?11:12)+'px '+FONT;ctx.lineWidth=1;
    ctx.strokeStyle=css('--grid');ctx.fillStyle=css('--muted');
    ctx.textAlign='center';ctx.textBaseline='top';
    for(let x=0;x<=100;x+=20){ctx.beginPath();ctx.moveTo(X(x)+.5,Y(YMIN));ctx.lineTo(X(x)+.5,Y(YMAX));ctx.stroke();ctx.fillText(x,X(x),Y(YMIN)+5);}
    ctx.textAlign='right';ctx.textBaseline='middle';
    const ystep=h<220?200:100;
    for(let y=0;y<=400;y+=ystep){ctx.beginPath();ctx.moveTo(X(XMIN),Y(y)+.5);ctx.lineTo(X(XMAX),Y(y)+.5);ctx.stroke();ctx.fillText(y,X(XMIN)-5,Y(y));}
    ctx.textAlign='center';ctx.textBaseline='bottom';ctx.font='600 '+(small?11:12)+'px '+FONT;
    ctx.fillText('Ads spent (x)',(X(XMIN)+X(XMAX))/2,h-1);
    ctx.save();ctx.translate(10,(Y(YMIN)+Y(YMAX))/2);ctx.rotate(-Math.PI/2);ctx.textBaseline='middle';ctx.fillText('Sales (y)',0,0);ctx.restore();

    ctx.save();ctx.beginPath();ctx.rect(X(XMIN),Y(YMAX),X(XMAX)-X(XMIN),Y(YMIN)-Y(YMAX));ctx.clip();
    if(st){
      const A=st.ma,B=st.mb;
      if(S.resid){ctx.strokeStyle=css('--resid');ctx.globalAlpha=.75;ctx.lineWidth=1.2;
        for(const q of S.pts){ctx.beginPath();ctx.moveTo(X(q.x),Y(q.y));ctx.lineTo(X(q.x),Y(A*q.x+B));ctx.stroke();}
        ctx.globalAlpha=1;}
      if(S.biased){ctx.strokeStyle=css('--line');ctx.globalAlpha=.35;ctx.lineWidth=2;ctx.setLineDash([6,5]);
        ctx.beginPath();ctx.moveTo(X(XMIN),Y(st.a*XMIN+st.b));ctx.lineTo(X(XMAX),Y(st.a*XMAX+st.b));ctx.stroke();
        ctx.setLineDash([]);ctx.globalAlpha=1;}
      ctx.strokeStyle=S.biased?css('--bad'):css('--line');ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(X(XMIN),Y(A*XMIN+B));ctx.lineTo(X(XMAX),Y(A*XMAX+B));ctx.stroke();
    }
    const rad=S.pts.length>150||small?3.2:4.5;
    ctx.fillStyle=css('--point');
    for(const q of S.pts){ctx.beginPath();ctx.arc(X(q.x),Y(q.y),rad,0,Math.PI*2);ctx.fill();}
    if(drag){ctx.strokeStyle=css('--ink');ctx.lineWidth=2;ctx.beginPath();ctx.arc(X(drag.x),Y(drag.y),rad+4,0,Math.PI*2);ctx.stroke();}
    ctx.restore();
  }

  /* curve */
  const cv=$('curve'),cvBox=$('curveBox');
  function drawCurve(st){
    const {ctx,w,h}=fit(cv,cvBox);if(w<40||h<40)return;
    const small=h<140;
    const m={l:42,r:12,t:8,b:small?22:30};
    const cx=r=>m.l+(r+1)/2*(w-m.l-m.r), cy=v=>h-m.b-v*(h-m.t-m.b);
    ctx.clearRect(0,0,w,h);ctx.font='11px '+FONT;ctx.lineWidth=1;
    ctx.strokeStyle=css('--grid');ctx.fillStyle=css('--muted');
    ctx.textAlign='center';ctx.textBaseline='top';
    for(let r=-1;r<=1.001;r+=0.5){ctx.beginPath();ctx.moveTo(cx(r)+.5,cy(0));ctx.lineTo(cx(r)+.5,cy(1));ctx.stroke();ctx.fillText(fmt(r,1),cx(r),cy(0)+4);}
    ctx.textAlign='right';ctx.textBaseline='middle';
    const vstep=small?0.5:0.25;
    for(let v=0;v<=1.001;v+=vstep){ctx.beginPath();ctx.moveTo(cx(-1),cy(v)+.5);ctx.lineTo(cx(1),cy(v)+.5);ctx.stroke();ctx.fillText(v.toFixed(2),cx(-1)-5,cy(v));}
    if(!small){ctx.font='600 11px '+FONT;ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText('R',(cx(-1)+cx(1))/2,h-1);}
    ctx.save();ctx.font='600 11px '+FONT;ctx.fillStyle=css('--muted');ctx.translate(9,(cy(0)+cy(1))/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('R²',0,0);ctx.restore();
    ctx.strokeStyle=css('--line');ctx.lineWidth=2.5;ctx.beginPath();
    for(let i=0;i<=200;i++){const r=-1+i/100;const px=cx(r),py=cy(r*r);i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
    ctx.stroke();
    if(st){
      const R=st.R,v=R*R;
      ctx.strokeStyle=css('--axis');ctx.setLineDash([4,4]);ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(cx(R),cy(0));ctx.lineTo(cx(R),cy(v));ctx.lineTo(cx(-1),cy(v));ctx.stroke();ctx.setLineDash([]);
      ctx.globalAlpha=.6;ctx.beginPath();ctx.arc(cx(-R),cy(v),5,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
      ctx.fillStyle=css('--point');ctx.beginPath();ctx.arc(cx(R),cy(v),6,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=css('--ink');ctx.font='600 11px '+FONT;
      const right=R>0.3;ctx.textAlign=right?'right':'left';
      ctx.textBaseline=v>0.75?'top':'bottom';
      ctx.fillText('R = '+fmt(R)+', R² = '+v.toFixed(2),cx(R)+(right?-10:10),cy(v)+(v>0.75?8:-8));
    }
  }

  function update(){
    const st=stats();
    if(st){
      $('rVal').textContent=fmt(st.R);
      const shown=S.biased?st.R2model:st.R2;
      $('r2Val').textContent=fmt(shown);
      $('r2Name').textContent=S.biased?'R² (biased model)':'R²';
      $('r2Card').classList.toggle('biased',S.biased);
      const a=S.biased?st.ma:st.a,b=S.biased?st.mb:st.b;
      $('eq').textContent='y = '+fmt(a)+'x '+(b<0?'− ':'+ ')+Math.abs(b).toFixed(1);
      let v=strength(st.R);
      if(S.biased)v+=shown<0?' The biased model is worse than guessing the average.':' Biased R² is below R × R = '+st.R2.toFixed(2)+'.';
      $('verdict').textContent=v;
      const pct=Math.max(0,Math.min(1,shown))*100;
      $('barFill').style.width=pct+'%';
      $('barExp').textContent='Explained '+pct.toFixed(0)+'%';
      $('barUnexp').textContent=shown<0?'Worse than the average':'Unexplained '+(100-pct).toFixed(0)+'%';
    }
    $('edited').classList.toggle('on',S.edited);
    drawScatter(st);drawCurve(st);
  }

  function pos(e){const r=sc.getBoundingClientRect();return {px:e.clientX-r.left,py:e.clientY-r.top};}
  sc.addEventListener('pointerdown',e=>{
    const {px,py}=pos(e);
    if(px<M.l||px>geom.w-M.r||py<M.t||py>geom.h-M.b)return;
    let best=null,bd=18*18;
    for(const q of S.pts){const dx=X(q.x)-px,dy=Y(q.y)-py,d=dx*dx+dy*dy;if(d<bd){bd=d;best=q;}}
    if(!best){best={x:iX(px),y:iY(py)};S.pts.push(best);}
    drag=best;S.edited=true;sc.setPointerCapture(e.pointerId);update();
  });
  sc.addEventListener('pointermove',e=>{
    if(!drag)return;const {px,py}=pos(e);
    drag.x=Math.max(XMIN,Math.min(XMAX,iX(px)));drag.y=Math.max(YMIN,Math.min(YMAX,iY(py)));update();
  });
  const end=()=>{if(drag){drag=null;update();}};
  sc.addEventListener('pointerup',end);sc.addEventListener('pointercancel',end);

  $('rSlider').addEventListener('input',e=>{S.r=+e.target.value;$('rOut').textContent=fmt(S.r);generate();});
  $('nSlider').addEventListener('input',e=>{S.n=+e.target.value;$('nOut').textContent=S.n;generate();});
  $('newBtn').addEventListener('click',generate);
  $('residChk').addEventListener('change',e=>{S.resid=e.target.checked;update();});
  $('badChk').addEventListener('change',e=>{S.biased=e.target.checked;update();});
  $('presets').addEventListener('click',e=>{
    const b=e.target.closest('button[data-r]');if(!b)return;
    S.r=+b.dataset.r;$('rSlider').value=S.r;$('rOut').textContent=fmt(S.r);generate();
  });

  let raf=0;const sched=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(update);};
  const ro=new ResizeObserver(sched);ro.observe(scBox);ro.observe(cvBox);
  window.addEventListener('resize',sched);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',update);
  new MutationObserver(update).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(update);
  generate();
})();
</script>
